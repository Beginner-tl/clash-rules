# =============================================================================
# sync-rules.yml —— 自动同步基础规则、编译 MRS/TXT 并发布到 main
# =============================================================================
name: Sync Rules

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync-rules.yml"

permissions:
  contents: write

concurrency:
  group: sync-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Download mihomo
        run: |
          set -euo pipefail
          TAG="$(python -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"))["tag_name"])')"
          echo "mihomo tag: $TAG"
          curl -fsSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/$TAG/mihomo-linux-amd64-$TAG.gz"
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Build rulesets
        env:
          MIHOMO_BIN: /tmp/mihomo
        run: bash scripts/build.sh

      - name: Verify output
        run: |
          set -euo pipefail
          test -s dist/mihomo/domain/GameStore.mrs
          test -s dist/mihomo/domain/GameStore.txt
          test -s dist/mihomo/domain/GameDownload.mrs
          test -s dist/mihomo/domain/GameDownload.txt
          test -s dist/mihomo/domain/Speedtest.mrs
          test -s dist/mihomo/domain/Speedtest.txt
          test -s dist/mihomo/domain/Direct.mrs
          test -s dist/mihomo/domain/Direct.txt
          test -s dist/mihomo/domain/Proxy.mrs
          test -s dist/mihomo/domain/Proxy.txt
          test -s dist/mihomo/domain/CrossBorder.mrs
          test -s dist/mihomo/domain/CrossBorder.txt
          test -s dist/mihomo/MANIFEST.json
          MRS_TOTAL="$(find dist/mihomo -name "*.mrs" | wc -l)"
          TXT_TOTAL="$(find dist/mihomo -name "*.txt" | wc -l)"
          echo "generated $MRS_TOTAL MRS files and $TXT_TOTAL TXT files"
          test "$MRS_TOTAL" -gt 0
          test "$TXT_TOTAL" -gt 0

      - name: Publish to main branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf mihomo
          cp -r dist/mihomo mihomo
          date -u +"%Y-%m-%d %H:%M:%S UTC" > mihomo/BUILD_TIME.txt

          git add -A mihomo
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "chore(rules): sync rule source $(date -u +%Y-%m-%d)"
            git push origin main
          fi

      - name: Summary
        run: |
          {
            echo "## Rule sync completed"
            echo
            echo "- MRS files: $(find dist/mihomo -name "*.mrs" | wc -l)"
            echo "- TXT files: $(find dist/mihomo -name "*.txt" | wc -l)"
            echo "- Sparkle override: https://raw.githubusercontent.com/Beginner-tl/Mihomo-rules/main/sparkle-override.yaml"
            echo "- Rule base: https://raw.githubusercontent.com/Beginner-tl/Mihomo-rules/main/mihomo/<domain|ip>/<Name>.<mrs|txt>"
          } >> "$GITHUB_STEP_SUMMARY"

