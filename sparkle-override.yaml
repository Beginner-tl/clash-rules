# 规则集路由
# 直接替换原订阅的 rules；如果你想保留原订阅规则，请改成 +rules，
# 但要注意下面的 MATCH 会让其后的规则不可达。
rules:

  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve
  - RULE-SET,CrossBorder,DIRECT

  # 日志确认的非广告补充项已并入既有 Direct / Proxy 分类
  - RULE-SET,Direct,DIRECT

  # 阿里妈妈香港域名：按国内直连处理，避免被 .hk 后缀归入国际流量
  - DOMAIN-SUFFIX,alimama.hk,DIRECT

  # 网络测速、CDN 性能探测和 RUM 端点不需要切换，直接连接
  - RULE-SET,Speedtest,DIRECT

  - RULE-SET,TM,即时通讯
  - RULE-SET,Telegram,即时通讯
  - RULE-SET,TelegramIP,即时通讯,no-resolve

  - RULE-SET,SocialMedia,社交平台
  - RULE-SET,SocialMediaIP,社交平台,no-resolve

  - RULE-SET,AI,人工智能
  - RULE-SET,AIIP,人工智能,no-resolve

  - RULE-SET,Dev,开发服务

  - RULE-SET,Emby,EMBY
  - RULE-SET,EmbyIP,EMBY,no-resolve
  - RULE-SET,Streaming,国际媒体
  - RULE-SET,StreamingIP,国际媒体,no-resolve

  # 下载规则集已合并上游列表和本地确认的 CDN，优先于商店规则集
  # 这样大文件下载/更新进入“游戏下载”，商店、登录、社区等平台服务仍进入商店策略组
  - RULE-SET,下载,游戏下载

  # 国际游戏平台商店统一进入“游戏平台商店”策略组

  # 商店规则集：平台服务、商店、登录和游戏服务器走可选策略
  - RULE-SET,商店,游戏平台商店
  # 货币平台保留独立规则集，直接归入国外流量，不单独提供切换策略
  - RULE-SET,Crypto,国外流量

  - RULE-SET,Google,谷歌服务
  - RULE-SET,GoogleIP,谷歌服务,no-resolve
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Facebook,脸书服务
  - RULE-SET,Apple,苹果服务

  - RULE-SET,Proxy,国外流量
  - RULE-SET,ProxyIP,国外流量,no-resolve

  - RULE-SET,China,国内流量
  - RULE-SET,ChinaIP,国内流量,no-resolve

  - MATCH,漏网之鱼

