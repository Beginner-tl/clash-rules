# Sparkle / Mihomo 覆写
# 远程规则源：Beginner-tl/Mihomo-rules；main 分支 MRS 自动更新，并叠加本仓库自定义规则
#
# 用法：
# 1. 在 Sparkle 的“覆写”中新建 YAML，并粘贴本文件内容；
# 2. 在目标订阅的“编辑信息 -> 覆写”中启用它；
# 3. 节点由 Sub-Store 导入的订阅提供，本文件只负责代理组、故障转移和分流。
#
# 说明：
# - +proxy-groups：追加代理组，不覆盖订阅原有代理组；
# - rules：用本文件的分流规则替换订阅原有规则，避免原规则先匹配导致分类不一致；
# - filter 按节点名称分类。节点名称不含地区关键词时，需要调整对应 filter。

+proxy-groups:
  # 核心出口
  - name: 国外流量
    type: select
    proxies:
      - 故障转移
      - 全球手动
      - 香港策略
      - 台湾策略
      - 日本策略
      - 新加坡策略
      - 美国策略
      - 澳洲策略
      - 英国策略
      - DIRECT

  - name: 国内流量
    type: select
    proxies:
      - DIRECT
      - 故障转移
      - 全球手动
      - 香港策略
      - 台湾策略
      - 日本策略
      - 新加坡策略
      - 美国策略
      - 澳洲策略
      - 英国策略

  # 总故障转移：先比较各地区自动组，再由地区自动组选择本地区低延迟节点
  - name: 故障转移
    type: url-test
    proxies:
      - 香港自动
      - 台湾自动
      - 日本自动
      - 新加坡自动
      - 美国自动
      - 澳洲自动
      - 英国自动
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    max-failed-times: 3
    empty-fallback: REJECT

  # 手动选择全部节点
  - name: 全球手动
    type: select
    include-all: true
    exclude-type: Direct|Reject

  - name: 漏网之鱼
